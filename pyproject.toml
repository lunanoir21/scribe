[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "SIM"]
ignore = [
  "S101",   # asserts are used in the tests
  "S603",   # subprocess with an argument list, never a shell string
  "S607",   # tools are found on PATH on purpose (grim, tesseract, terminals)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
