name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint Python
        run: ruff check .
      - name: Lint shell
        run: shellcheck -S style scribe.sh install.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
